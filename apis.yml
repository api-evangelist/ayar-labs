aid: ayar-labs
name: Ayar Labs
description: Ayar Labs is a silicon-photonics company that develops co-packaged optics
  (CPO) and optical I/O technology to replace copper interconnects with light. Its
  products, including the TeraPHY optical engine and SuperNova external light source,
  connect thousands of GPUs across racks to deliver the bandwidth density and energy
  efficiency required by hyperscale AI infrastructure. Ayar Labs is backed by Insight
  Partners and Playground Global. It ships hardware and optical-interconnect technology
  rather than a public developer API; this API Evangelist profile tracks the company's
  public web properties and domain security posture.
